name: CI

on:
  pull_request:
    branches: [main]
  # deploy.yml calls this workflow first, so nothing reaches AWS without passing the same checks.
  workflow_call:

# The token can only read the repository. No job here needs more, and none touches AWS.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0" # never wait for a prompt in CI

# The job names (backend, frontend, terraform) are what the "protect-main" ruleset requires.
# Renaming one here means updating the ruleset too.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps do not need the token, so it is not left on disk
      - uses: ./.github/actions/setup-node-yarn
      - run: yarn workspace @aws-starter/backend typecheck
      - run: yarn workspace @aws-starter/backend lint
      - run: yarn workspace @aws-starter/backend test
      - run: yarn workspace @aws-starter/backend build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - run: yarn workspace @aws-starter/frontend typecheck
      - run: yarn workspace @aws-starter/frontend lint
      - run: yarn workspace @aws-starter/frontend test
      # The build needs no API or Cognito values: the app reads them when it starts.
      - run: yarn workspace @aws-starter/frontend build

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false # the wrapper would add its own output to every command
      - run: terraform fmt -check -recursive
      # No backend and no AWS credentials: this only checks that the configuration is valid.
      # A real `plan` needs the deploy role, which trusts the main branch only, so it runs
      # in deploy.yml after the merge.
      - name: Validate
        run: |
          for dir in bootstrap infra/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
